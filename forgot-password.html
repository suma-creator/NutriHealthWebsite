<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password — NutriHealth</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-visual">
      <span class="eyebrow" style="background:rgba(255,255,255,0.18);color:#fff;" data-i18n="forgot_visual_eyebrow">Account recovery</span>
      <h2 class="mt-24" data-i18n="forgot_visual_title">Forgot your password? No problem.</h2>
      <p class="mt-16" data-i18n="forgot_visual_subtitle">Enter the email you signed up with and we'll send you a secure link to set a new one.</p>

      <svg class="vitals-wave mt-32" viewBox="0 0 400 60" preserveAspectRatio="none">
        <defs>
          <linearGradient id="waveGradient" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#c6f6ea" />
          </linearGradient>
        </defs>
        <path d="M0,30 L40,30 L55,10 L70,50 L85,30 L110,30 L125,15 L140,45 L155,30 L400,30" />
      </svg>
    </div>

    <div class="auth-form-side">
      <div class="auth-card">
        <a href="index.html" class="brand mb-32" style="display:inline-flex;">
          <span class="brand-mark">✚</span> NutriHealth
        </a>

        <h2 data-i18n="forgot_title">Reset your password</h2>
        <p class="mt-8"><span data-i18n="forgot_remembered">Remembered it?</span> <a href="login.html" class="gradient-text" style="font-weight:600;" data-i18n="forgot_back_to_login">Back to log in</a></p>

        <form id="forgotForm" class="mt-32" onsubmit="handleForgotPassword(event)">
          <div class="form-group">
            <label class="form-label" for="email" data-i18n="login_email_label">Email address</label>
            <input class="form-input" type="email" id="email" required placeholder="you@example.com" />
          </div>
          <button type="submit" id="forgotBtn" class="btn btn-primary btn-block mt-16" data-i18n="forgot_submit">Send reset link</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
