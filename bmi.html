<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BMI Calculator — NutriHealth</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="pageLoader" class="page-loader"><div class="loader-pulse"></div></div>

  <div class="app-shell">
    <div id="sidebarContainer"></div>
    <div class="sidebar-overlay"></div>

    <div class="main-content">
      <div id="topbarContainer"></div>

      <div class="page-body">
        <h2 data-i18n="bmi_title">BMI Calculator</h2>
        <p class="text-sm mt-8 mb-24" data-i18n="bmi_subtitle">Enter your height and weight to calculate your Body Mass Index.</p>

        <div class="grid" style="grid-template-columns:1fr;align-items:start;" id="bmiGrid">
          <!-- Form -->
          <div class="card">
            <div id="profileSelector"></div>
            <form id="bmiForm">
              <div class="form-group">
                <label class="form-label" for="height" data-i18n="bmi_height_label">Height (cm)</label>
                <input class="form-input" type="number" id="height" min="50" max="250" step="0.1" required placeholder="e.g. 170" />
              </div>
              <div class="form-group">
                <label class="form-label" for="weight" data-i18n="bmi_weight_label">Weight (kg)</label>
                <input class="form-input" type="number" id="weight" min="10" max="400" step="0.1" required placeholder="e.g. 65" />
              </div>
              <button type="submit" id="bmiBtn" class="btn btn-primary btn-block" data-i18n="bmi_calculate_btn">Calculate &amp; save</button>
            </form>
          </div>

          <!-- Result -->
          <div class="card" id="resultCard" style="display:none;">
            <div class="text-center">
              <span class="stat-icon icon-teal" id="resultIcon" style="margin:0 auto;">⚖️</span>
              <div class="stat-value mt-16" id="resultBmi" style="font-size:2.6rem;">—</div>
              <div class="stat-label" id="resultCategory">—</div>
            </div>
            <p class="text-sm mt-24" id="resultTip"></p>
          </div>
        </div>

        <!-- History -->
        <h4 class="mt-32 mb-16" data-i18n="bmi_history_heading">Your BMI history</h4>
        <div class="card">
          <table style="width:100%;border-collapse:collapse;" id="historyTable">
            <thead>
              <tr style="text-align:left;border-bottom:1px solid var(--color-border);">
                <th style="padding:10px 0;" class="text-sm text-muted" data-i18n="table_date">Date</th>
                <th style="padding:10px 0;" class="text-sm text-muted" data-i18n="bmi_height_label">Height</th>
                <th style="padding:10px 0;" class="text-sm text-muted" data-i18n="bmi_weight_label">Weight</th>
                <th style="padding:10px 0;" class="text-sm text-muted" data-i18n="bmi_table_bmi">BMI</th>
                <th style="padding:10px 0;" class="text-sm text-muted" data-i18n="bmi_table_category">Category</th>
              </tr>
            </thead>
            <tbody id="historyBody">
              <tr><td colspan="5" class="text-sm text-muted" style="padding:16px 0;" data-i18n="common_loading">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/profile-context.js"></script>
  <script src="js/bmi.js"></script>
</body>
</html>
