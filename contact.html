<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact — NutriHealth</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="navbar">
    <div class="container">
      <a href="index.html" class="brand"><span class="brand-mark">✚</span> NutriHealth</a>
      <nav class="nav-links">
        <a href="index.html" data-i18n="landing_nav_home">Home</a>
        <a href="about.html" data-i18n="landing_nav_about">About</a>
        <a href="features.html" data-i18n="landing_nav_features">Features</a>
        <a href="contact.html" class="active" data-i18n="landing_nav_contact">Contact</a>
      </nav>
      <div class="nav-actions">
        <button class="lang-toggle" aria-label="Switch language">বাং</button>
        <button class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
        <a href="login.html" class="btn btn-ghost" data-i18n="landing_cta_login">Log in</a>
        <a href="register.html" class="btn btn-primary" data-i18n="landing_cta_get_started_short">Get started</a>
        <button class="nav-toggle" aria-label="Open menu">☰</button>
      </div>
    </div>
  </header>

  <section class="section">
    <div class="container" style="max-width:640px;">
      <div class="text-center mb-32">
        <span class="eyebrow" data-i18n="contact_eyebrow">Get in touch</span>
        <h1 class="mt-16" data-i18n="contact_hero_title">We'd love to hear from you</h1>
      </div>

      <form class="card" id="contactForm">
        <div class="form-group">
          <label class="form-label" for="cName" data-i18n="contact_name_label">Name</label>
          <input class="form-input" type="text" id="cName" required placeholder="Your name" />
        </div>
        <div class="form-group">
          <label class="form-label" for="cEmail" data-i18n="contact_email_label">Email</label>
          <input class="form-input" type="email" id="cEmail" required placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label class="form-label" for="cMessage" data-i18n="contact_message_label">Message</label>
          <textarea class="form-textarea" id="cMessage" rows="5" required placeholder="How can we help?"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block" data-i18n="contact_submit">Send message</button>
      </form>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <span data-i18n="footer_copyright">© 2026 NutriHealth. Built for educational purposes — not a substitute for professional medical advice.</span>
      <a href="index.html" data-i18n="footer_back_home">Back to home</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    // Demo-only: this project doesn't yet wire contact messages to a table.
    // Add a "messages" table in Supabase and an insert call here if needed.
    document.getElementById("contactForm").addEventListener("submit", (e) => {
      e.preventDefault();
      showToast("Message sent! We'll get back to you soon.", "success");
      e.target.reset();
    });
  </script>
</body>
</html>
